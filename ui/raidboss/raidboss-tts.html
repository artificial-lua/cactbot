<script type="text/javascript">
  // Studio Artificial: raidboss.html 과 같고, 읽는 문장만 사용자 파일의 TTS 전용 문구(PerTriggerOptions[id].TTSOutputStrings)를 쓴다
  let redirUrl = 'raidboss.html?studioTts=1';
  if (typeof window !== 'undefined') {
    const wsUrl = /[\?&](OVERLAY_WS=[^&]+)/.exec(window.location.href);
    if (wsUrl) {
      redirUrl += '&' + wsUrl[1];
    }
  }
  window.location.href = redirUrl;
</script>
