# Studio Artificial: ACT 플러그인(ffxiv-battle-parser)이 내려받아 쓰는 cactbot 빌드본.
#   master/release/develop 브랜치와 태그를 push 하면 `npm run build` 결과(dist/)를 브랜치 `dist/<브랜치 또는 태그>` 에
#   커밋 하나로 덮어 올린다(기록을 쌓지 않는다). 플러그인은 settings.json 의 CactbotBranch(기본 master)에 맞는
#   dist/<이름> 의 .studio-build.json 을 보고 바뀌었으면 zip 으로 받아 캐시한다.
#   실행 조건은 프로젝트 공통 규칙(2026-09-27) 그대로 — PR·작업 브랜치·수동 실행은 없다.
name: studio-dist

on:
  push:
    branches: [master, release, develop]
    tags: ['v*', '*.*.*']

permissions:
  contents: write

concurrency:
  group: studio-dist-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-js-env

      - name: Build JavaScript UI Module Bundles
        run: npm run build
        timeout-minutes: 15

      - name: Publish dist/${{ github.ref_name }}
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          SRC_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f dist/ui/raidboss/raidboss.html
          printf '{"source":"%s","ref":"%s","built":"%s"}\n' "$SRC_SHA" "$REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/.studio-build.json
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dist: $REF_NAME @ ${SRC_SHA:0:9}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/dist/${REF_NAME}"
